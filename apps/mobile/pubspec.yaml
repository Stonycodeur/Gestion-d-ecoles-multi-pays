name: ecolemanager_mobile
description: ÉcoleManager Pro - application mobile (Android et iOS)
publish_to: none
version: 0.1.0+1
environment: { sdk: ">=3.3.0 <4.0.0", flutter: ">=3.19.0" }
dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  intl: any
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  flutter_secure_storage: ^9.2.2
  flutter_appauth: ^8.0.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  model_viewer_plus: ^1.9.2
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
flutter: { uses-material-design: true, generate: true }
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1B4F9C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
flutter_native_splash:
  color: "#1B4F9C"
  color_dark: "#0F2A57"
  image: assets/icon/splash.png
  android_12:
    color: "#1B4F9C"
    image: assets/icon/splash.png
