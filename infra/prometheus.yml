global: { scrape_interval: 15s }
rule_files: [ /etc/prometheus/alerts.yml ]
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # The API only serves /metrics when METRICS_TOKEN is set; put the same value in this file (mounted, never committed).
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs: [ { targets: ["api:3000"] } ]
