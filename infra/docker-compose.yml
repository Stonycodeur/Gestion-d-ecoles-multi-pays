# Dev stack: `docker compose -f infra/docker-compose.yml up`. Secrets come from .env (never committed).
services:
  postgres:   # TimescaleDB image includes PostgreSQL 16 + the timescaledb extension (GPS series)
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_USER: "${PG_USER:-ecole}", POSTGRES_PASSWORD: "${PG_PASSWORD:?set in .env}", POSTGRES_DB: ecolemanager, APP_RUNTIME_PASSWORD: "${APP_RUNTIME_PASSWORD:?set in .env}" }
    volumes:   # only the schema files: test_*.sql and run_tests.sh must never run at init
      - pgdata:/var/lib/postgresql/data
      - ./sql/000_runtime_role.sh:/docker-entrypoint-initdb.d/000_runtime_role.sh:ro
      - ./sql/010_core.sql:/docker-entrypoint-initdb.d/010_core.sql:ro
      - ./sql/020_seed_roles.sql:/docker-entrypoint-initdb.d/020_seed_roles.sql:ro
      - ./sql/030_seed_countries.sql:/docker-entrypoint-initdb.d/030_seed_countries.sql:ro
      - ./sql/040_tenant_template.sql:/docker-entrypoint-initdb.d/040_tenant_template.sql:ro
      - ./sql/050_marketplace.sql:/docker-entrypoint-initdb.d/050_marketplace.sql:ro
      - ./sql/060_idempotency.sql:/docker-entrypoint-initdb.d/060_idempotency.sql:ro
      - ./sql/070_settings.sql:/docker-entrypoint-initdb.d/070_settings.sql:ro
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ${PG_USER:-ecole}"], interval: 5s, retries: 10 }
  ai:   # service IA prédictive (FastAPI) ; l'API l'utilise avec AI_MODE=live, sinon modèle local en processus (sandbox)
    build: ../apps/ai
    environment: { AI_SERVICE_KEY: "${AI_SERVICE_KEY:-dev-ai-key}" }
    ports: ["8001:8000"]
  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: "${RABBIT_USER:-ecole}", RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD:?set in .env}" }
    ports: [ "5672:5672", "15672:15672" ]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_USER:-ecole}", MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?set in .env}" }
    volumes: [ "miniodata:/data" ]
    ports: [ "9000:9000", "9001:9001" ]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: [ "9200:9200" ]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    volumes: [ "./keycloak:/opt/keycloak/data/import:ro" ]
    environment: { KEYCLOAK_ADMIN: "${KC_ADMIN:-admin}", KEYCLOAK_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?set in .env}" }
    ports: [ "8080:8080" ]
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment: &apienv
      NODE_ENV: development
      DATABASE_URL: "postgres://app_runtime:${APP_RUNTIME_PASSWORD}@postgres:5432/ecolemanager"
      DATABASE_ADMIN_URL: "postgres://${PG_USER:-ecole}:${PG_PASSWORD}@postgres:5432/ecolemanager"
      AUTH_MODE: "${AUTH_MODE:-sandbox}"
      SANDBOX_JWT_SECRET: "${SANDBOX_JWT_SECRET:?set in .env (>= 32 chars)}"
      MESSAGE_KEY: "${MESSAGE_KEY:?set in .env}"
      WEBHOOK_KEY: "${WEBHOOK_KEY:?set in .env}"
      GPS_KEY: "${GPS_KEY:?set in .env}"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?set in .env}"
      MODULES_DIR: /repo/packages/modules
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"            # e.g. http://keycloak:8080/realms/ecolemanager with AUTH_MODE=oidc
      OIDC_JWKS_URI: "${OIDC_JWKS_URI:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-ecolemanager-api}"
    ports: [ "3000:3000" ]
  seed:   # one-shot Gabon demo data: `docker compose --profile seed run --rm seed`
    profiles: ["seed"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment: *apienv
    command: ["node", "dist/seed/demo-seed.js"]
  web:
    build: { context: .., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_BASE: "${PUBLIC_API_URL:-http://localhost:3000}" } }
    depends_on: [api]
    ports: [ "3001:3001" ]
  prometheus:
    image: prom/prometheus:latest
    volumes: [ "./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro", "${METRICS_TOKEN_FILE:-./metrics_token.example}:/etc/prometheus/metrics_token:ro" ]
    ports: [ "9090:9090" ]
  grafana:
    image: grafana/grafana:latest
    ports: [ "3002:3000" ]
    volumes: [ "./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro" ]
volumes: { pgdata: {}, miniodata: {} }
