apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: ecolemanager, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/stonycodeur/ecolemanager-web:latest
          ports: [ { containerPort: 3001 } ]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /, port: 3001 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: ecolemanager }
spec: { selector: { app: web }, ports: [ { port: 3001, targetPort: 3001 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai, namespace: ecolemanager, labels: { app: ai } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai } }
  template:
    metadata: { labels: { app: ai } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ai
          image: ghcr.io/stonycodeur/ecolemanager-ai:latest
          ports: [ { containerPort: 8000 } ]
          env: [ { name: AI_SERVICE_KEY, valueFrom: { secretKeyRef: { name: ecolemanager-secrets, key: AI_SERVICE_KEY, optional: true } } } ]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: ai, namespace: ecolemanager }
spec: { selector: { app: ai }, ports: [ { port: 8000, targetPort: 8000 } ] }
