groups:
  - name: ecolemanager
    rules:
      - alert: ApiLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m]))) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 de l'API au-dessus de 200 ms (objectif spec 12.1)" }
      - alert: ApiErrorRateHigh
        expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Plus de 2 % d'erreurs 5xx" }
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "API injoignable" }
