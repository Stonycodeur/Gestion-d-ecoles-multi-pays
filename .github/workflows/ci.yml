name: CI
on: { push: { branches: ["**"] }, pull_request: {} }
jobs:
  shared-and-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run test:shared
      - run: npm run test:sql
  api-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      DATABASE_ADMIN_URL: postgres://postgres:ci@localhost:5432/em_e2e
      DATABASE_URL: postgres://app_runtime:rt@localhost:5432/em_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database for e2e (non-superuser runtime role so RLS applies)
        run: |
          createdb em_e2e
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime LOGIN PASSWORD 'rt'"
          for f in 010_core.sql 020_seed_roles.sql 030_seed_countries.sql 040_tenant_template.sql; do psql -v ON_ERROR_STOP=1 -q -d em_e2e -f infra/sql/$f; done
          psql -v ON_ERROR_STOP=1 -d em_e2e -c "GRANT USAGE ON SCHEMA public TO app_runtime; GRANT SELECT ON ALL TABLES IN SCHEMA public TO app_runtime; GRANT INSERT ON audit_logs TO app_runtime; GRANT USAGE ON SEQUENCE audit_logs_id_seq TO app_runtime"
      - run: npm install
      - run: npm run test:shared
      - run: npm --prefix apps/api run build && npm --prefix apps/api test
      - run: npm --prefix apps/web run build
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: apps/ai
        run: |
          pip install numpy scikit-learn
          python train.py
          python -m unittest discover -s tests
      - name: Model artefacts are reproducible (no diff after retraining)
        run: git diff --exit-code apps/ai/model/model.json apps/ai/model/golden.json
  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate native platform folders if absent
        working-directory: apps/mobile
        run: flutter create --platforms=android,ios --org com.ecolemanager --project-name ecolemanager_mobile .
      - name: Native permissions and background modes (location, notifications, camera)
        working-directory: apps/mobile/tool
        run: python3 -m unittest test_configure_native && python3 configure_native.py ..
      - working-directory: apps/mobile
        run: flutter pub get && flutter gen-l10n && flutter analyze --no-fatal-infos && flutter test && flutter build apk --debug
  # iOS signed build: added in phase 7, only when signing secrets exist (never read from the repo).
