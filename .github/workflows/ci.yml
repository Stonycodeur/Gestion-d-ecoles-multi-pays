name: CI
on: { push: { branches: ["**"] }, pull_request: {} }
jobs:
  shared-and-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run test:shared
      - run: npm run test:sql
  api-web:
    runs-on: ubuntu-latest
    services:
      postgres:   # TimescaleDB image: the GPS series become a hypertable (the web-e2e job keeps plain PostgreSQL and covers the fallback)
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 12
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 10s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      DATABASE_ADMIN_URL: postgres://postgres:ci@localhost:5432/em_e2e
      DATABASE_URL: postgres://app_runtime:rt@localhost:5432/em_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database for e2e (non-superuser runtime role so RLS applies)
        run: |
          createdb em_e2e
          psql -v ON_ERROR_STOP=1 -d em_e2e -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime LOGIN PASSWORD 'rt'"
          for f in 010_core.sql 020_seed_roles.sql 030_seed_countries.sql 040_tenant_template.sql 050_marketplace.sql 060_idempotency.sql 070_settings.sql 080_tenants_admin.sql; do psql -v ON_ERROR_STOP=1 -q -d em_e2e -f infra/sql/$f; done
          psql -v ON_ERROR_STOP=1 -d em_e2e -c "GRANT USAGE ON SCHEMA public TO app_runtime; GRANT SELECT ON ALL TABLES IN SCHEMA public TO app_runtime; GRANT INSERT ON audit_logs TO app_runtime; GRANT USAGE ON SEQUENCE audit_logs_id_seq TO app_runtime"
      - run: npm install
      - run: npm run test:shared
      - run: npm --prefix apps/api run build && npm --prefix apps/api test
        env: { REDIS_URL_TEST: 'redis://localhost:6379', ES_URL_TEST: 'http://localhost:9200', RABBITMQ_URL_TEST: 'amqp://guest:guest@localhost:5672', TIMESCALE_EXPECTED: '1' }
      - run: npm --prefix apps/web run build
  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      DATABASE_ADMIN_URL: postgres://postgres:ci@localhost:5432/em_e2e
      DATABASE_URL: postgres://app_runtime:rt@localhost:5432/em_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database for e2e (non-superuser runtime role so RLS applies)
        run: |
          createdb em_e2e
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime LOGIN PASSWORD 'rt'"
          for f in 010_core.sql 020_seed_roles.sql 030_seed_countries.sql 040_tenant_template.sql 050_marketplace.sql 060_idempotency.sql 070_settings.sql 080_tenants_admin.sql; do psql -v ON_ERROR_STOP=1 -q -d em_e2e -f infra/sql/$f; done
          psql -v ON_ERROR_STOP=1 -d em_e2e -c "GRANT USAGE ON SCHEMA public TO app_runtime; GRANT SELECT ON ALL TABLES IN SCHEMA public TO app_runtime; GRANT INSERT ON audit_logs TO app_runtime; GRANT USAGE ON SEQUENCE audit_logs_id_seq TO app_runtime"
      - run: npm install
      - run: npm --prefix apps/api run build
      - name: Demo seed (Gabon)
        run: npm --prefix apps/api run seed:demo
      - name: Start the API (sandbox auth, strict CORS for the web origin)
        run: |
          AUTH_MODE=sandbox SANDBOX_JWT_SECRET=$(printf 'e%.0s' $(seq 1 40)) MODULES_DIR=$PWD/packages/modules CORS_ORIGINS=http://localhost:3001 PORT=3000 \
            RATE_LIMIT_PER_MIN=10000000 RATE_LIMIT_AUTH_PER_MIN=100000 nohup node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 2; done
          curl -sf http://localhost:3000/health
      - name: Build and start the web app
        run: |
          npm --prefix apps/web run build
          cd apps/web && nohup npm run start -- -p 3001 > ../../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/login >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3001/login >/dev/null || { cat web.log; exit 1; }
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - name: "Load test on the seeded Gabon school (shared CI runners are slow: budget 300 ms here, product target 200 ms)"
        shell: bash   # pipefail: a failing load test must fail the job even through tee
        run: API_BASE=http://localhost:3000 TENANT=ga_lycee CONCURRENCY=10 DURATION_S=20 P95_BUDGET_MS=300 PATHS=/settings/country,/settings/grading,/timetable,/lessons,/classes,/me/abilities node infra/loadtest/p95.mjs | tee loadtest.txt
      - name: "Load test: PDF, writes, assistant and predictive run (budgets are CI-runner budgets, see docs/PERFORMANCE.md)"
        shell: bash
        run: API_BASE=http://localhost:3000 TENANT=ga_lycee DURATION_S=25 node infra/loadtest/mixed.mjs | tee loadtest-mixed.txt
      - if: failure()
        run: tail -n 60 api.log web.log || true

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: apps/ai
        run: |
          pip install numpy scikit-learn
          python train.py
          python -m unittest discover -s tests
      - name: Model artefacts are reproducible (no diff after retraining)
        run: git diff --exit-code apps/ai/model/model.json apps/ai/model/golden.json
  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate native platform folders if absent
        working-directory: apps/mobile
        run: flutter create --platforms=android,ios --org com.ecolemanager --project-name ecolemanager_mobile .
      - name: Native permissions and background modes (location, notifications, camera)
        working-directory: apps/mobile/tool
        run: python3 -m unittest test_configure_native && python3 configure_native.py ..
      - working-directory: apps/mobile
        run: flutter pub get && dart run flutter_launcher_icons && dart run flutter_native_splash:create && flutter gen-l10n && flutter analyze --no-fatal-infos && flutter test && flutter build apk --debug
  # iOS signed build: added in phase 7, only when signing secrets exist (never read from the repo).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: No secrets in tracked files
        run: |
          if git grep -nIE -e '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' -e 'sk_live_[0-9a-zA-Z]{16,}' -e 'AIza[0-9A-Za-z_-]{35}' -e 'xox[abp]-[0-9A-Za-z-]{10,}' -- . ':!*.md' ':!**/*.spec.ts' ':!**/test/**'; then echo "::error::possible secret committed"; exit 1; fi
          if git ls-files | grep -E '\.(jks|keystore|p12|mobileprovision)$|(^|/)google-services\.json$|(^|/)GoogleService-Info\.plist$|(^|/)\.env$'; then echo "::error::signing/secret file tracked"; exit 1; fi
      - name: Dependency audit (production dependencies, high and critical)
        run: |
          npm install --ignore-scripts
          npm audit --omit=dev --json > audit.json || true
          node -e "const a=require('./audit.json');for(const [n,v] of Object.entries(a.vulnerabilities||{})){const f=v.fixAvailable;console.log(v.severity.padEnd(9),n.padEnd(34),'range',v.range,'| fix:',f===true?'npm audit fix':f===false?'none':f.name+'@'+f.version+(f.isSemVerMajor?' (MAJOR)':''))}"
          node infra/security/audit-gate.mjs audit.json
